name: Strona aplikacji

# Publikuje folder site/ jako stronę na GitHub Pages: https://slam0.github.io/Currency/
# Jednorazowo: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - '.github/workflows/strona.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
